openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: journal
    description: Stateless journal analysis
  - name: co-op
    description: Private two-player panda households and emotion-only messages
paths:
  /pet/save:
    get:
      operationId: getPetSave
      tags: [co-op]
      summary: Read private account gameplay save
      responses:
        "200":
          description: Private save and optimistic revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetSaveRecord"
        "401":
          description: Sign in required
    put:
      operationId: updatePetSave
      tags: [co-op]
      summary: Save private gameplay progress without chat or diary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetSaveInput"
      responses:
        "200":
          description: Saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetSaveRecord"
        "400":
          description: Invalid save
        "401":
          description: Sign in required
        "409":
          description: A newer save exists
  /pet/character:
    get:
      operationId: getPetCharacter
      tags: [co-op]
      summary: Read the account's permanent character choice
      responses:
        "200":
          description: First choice, or the common household choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetCharacterSelection"
        "401":
          description: Sign in required
    post:
      operationId: choosePetCharacter
      tags: [co-op]
      summary: Choose one permanent pet for this account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetCharacterInput"
      responses:
        "200":
          description: Permanent character selection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetCharacterSelection"
        "400":
          description: Invalid character
        "401":
          description: Sign in required
        "409":
          description: Already selected, transformation is not available
  /coop/household:
    get:
      operationId: getCoopHousehold
      tags: [co-op]
      summary: Get the authenticated player's shared panda household
      responses:
        "200":
          description: Household, shared room state, pending shares, and received notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopHouseholdResponse"
        "401":
          description: Authentication required
    post:
      operationId: createCoopHousehold
      tags: [co-op]
      summary: Start a shared panda household from a private local game snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopHouseholdInput"
      responses:
        "201":
          description: Household created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopHouseholdResponse"
        "401":
          description: Authentication required
        "409":
          description: Player already belongs to a household
  /coop/invitations:
    post:
      operationId: createCoopInvitation
      tags: [co-op]
      summary: Create a one-time invite code for the second player
      responses:
        "201":
          description: Invite code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopInvitationResponse"
        "401":
          description: Authentication required
        "409":
          description: Household already has two players
  /coop/join:
    post:
      operationId: joinCoopHousehold
      tags: [co-op]
      summary: Join a household with an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopJoinInput"
      responses:
        "200":
          description: Joined household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopHouseholdResponse"
        "400":
          description: Invalid or expired invitation
        "401":
          description: Authentication required
        "409":
          description: Household is full or player already belongs to one
  /coop/state:
    put:
      operationId: updateCoopState
      tags: [co-op]
      summary: Update the household's shared game and room state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopStateInput"
      responses:
        "200":
          description: Shared state saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopStateResponse"
        "401":
          description: Authentication required
        "404":
          description: No household
  /coop/stats/interactions:
    post:
      operationId: recordCoopCareStatInteraction
      tags: [co-op]
      summary: Apply a care interaction to shared panda stats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopCareStatInteractionInput"
      responses:
        "200":
          description: Updated shared care stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopCareStatInteractionResponse"
        "400":
          description: Invalid interaction
        "401":
          description: Authentication required
        "404":
          description: No household
  /coop/share-notes:
    post:
      operationId: createCoopShareNote
      tags: [co-op]
      summary: Turn a private diary note into a brief emotion-only message for the other player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopShareNoteInput"
      responses:
        "201":
          description: Emotion-only share candidate created; original text is not stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopShareNote"
        "401":
          description: Authentication required
        "404":
          description: No paired household
        "502":
          description: Summary service unavailable
  /coop/share-notes/{id}:
    patch:
      operationId: updateCoopShareNote
      tags: [co-op]
      summary: Mark a queued note as excluded or allow it to be carried
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopShareNoteUpdate"
      responses:
        "200":
          description: Share preference updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopShareNote"
        "401":
          description: Authentication required
        "404":
          description: Note not found
  /coop/deliver-next:
    post:
      operationId: deliverNextCoopShareNote
      tags: [co-op]
      summary: Deliver one queued note from the other player when the panda returns from an outing
      responses:
        "200":
          description: The next note, if one was waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopDeliveryResponse"
        "401":
          description: Authentication required
        "404":
          description: No paired household
  /companion/chat:
    post:
      operationId: companionChat
      tags: [journal]
      summary: Contextual companion reply and local diary suggestions, never stored on server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionInput"
      responses:
        "200":
          description: Companion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionResponse"
        "400":
          description: Invalid conversation
        "429":
          description: Too many requests
        "502":
          description: Provider unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /journal/classify:
    post:
      operationId: classifyJournalEntry
      tags: [journal]
      summary: Classify journal text without storing it on the server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalClassificationInput"
      responses:
        "200":
          description: AI classification and gentle personalized reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalClassification"
        "400":
          description: Invalid text
        "429":
          description: Too many requests
        "502":
          description: AI analysis unavailable
components:
  schemas:
    PetSaveSnapshot:
      type: object
      required: [room, pet]
      properties:
        room:
          $ref: "#/components/schemas/CoopSharedState"
        pet:
          type: object
          additionalProperties: {}
    PetSaveInput:
      type: object
      required: [snapshot, revision]
      properties:
        snapshot:
          $ref: "#/components/schemas/PetSaveSnapshot"
        revision:
          type: integer
          minimum: 0
    PetSaveRecord:
      type: object
      required: [snapshot, revision]
      properties:
        snapshot:
          anyOf:
            - $ref: "#/components/schemas/PetSaveSnapshot"
            - type: "null"
        revision:
          type: integer
          minimum: 0
        migrated:
          type: boolean
    PetCharacterInput:
      type: object
      required: [characterId]
      properties:
        characterId:
          type: string
          enum: [panda, xiaobai]
    PetCharacterSelection:
      type: object
      required: [characterId, locked, shared]
      properties:
        characterId:
          type: [string, "null"]
          enum: [panda, xiaobai, null]
        locked:
          type: boolean
        shared:
          type: boolean
    CoopRoomPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
    CoopGift:
      type: object
      required: [id, emoji, item, animal, story, receivedAt]
      properties:
        id:
          type: string
          maxLength: 120
        emoji:
          type: string
          maxLength: 16
        item:
          type: string
          maxLength: 120
        animal:
          type: string
          maxLength: 120
        story:
          type: string
          maxLength: 1200
        receivedAt:
          type: integer
          minimum: 0
        favorite:
          type: boolean
        fedAt:
          type: integer
          minimum: 0
    CoopSharedState:
      type: object
      required: [gifts, furnitureLayout, placedProps]
      properties:
        gifts:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/CoopGift"
        furnitureLayout:
          type: object
          properties:
            bed:
              $ref: "#/components/schemas/CoopRoomPoint"
            rack:
              $ref: "#/components/schemas/CoopRoomPoint"
            mailbox:
              $ref: "#/components/schemas/CoopRoomPoint"
            bathStation:
              $ref: "#/components/schemas/CoopRoomPoint"
            trashCan:
              $ref: "#/components/schemas/CoopRoomPoint"
          additionalProperties: false
        placedProps:
          type: object
          additionalProperties:
            type: boolean
        careStats:
          $ref: "#/components/schemas/CoopCareStats"
        worldEcology:
          $ref: "#/components/schemas/CoopWorldEcologyState"
        foxMerchantLetter:
          $ref: "#/components/schemas/CoopFoxMerchantLetter"
    CoopWorldEcologyState:
      type: object
      required: [lastAttentionAt, fallCycle, dirtyHealthAppliedMinutes, updatedAt]
      properties:
        lastAttentionAt:
          type: integer
          minimum: 0
        fallCycle:
          type: string
          enum: [first, needs-clean, after-clean]
        lastFallRollAt:
          type: integer
          minimum: 0
        dirtySince:
          type: integer
          minimum: 0
        dirtyHealthAppliedMinutes:
          type: integer
          minimum: 0
        updatedAt:
          type: integer
          minimum: 0
    CoopFoxMerchantLetter:
      type: object
      required: [id, sentAt, petName, foxName, status, snacksAtCapture]
      properties:
        id:
          type: string
          maxLength: 120
        sentAt:
          type: integer
          minimum: 0
        petName:
          type: string
          maxLength: 40
        foxName:
          type: string
          maxLength: 80
        status:
          type: string
          enum: [captured, reset, rescued]
        snacksAtCapture:
          type: integer
          minimum: 0
        openedAt:
          type: integer
          minimum: 0
        resolvedAt:
          type: integer
          minimum: 0
    CoopCareStatCategory:
      type: string
      enum: [health, bond, growth]
    CoopCareStats:
      type: object
      required: [growth, health, bond, lastInteractionAt, lastDecayAt, revision, lastInteractionCategory, recentInteractionIds]
      properties:
        growth:
          type: integer
          minimum: 0
          maximum: 100
        health:
          type: number
          minimum: 0
          maximum: 100
        bond:
          type: integer
          minimum: 0
          maximum: 100
        hunger:
          type: integer
          minimum: 0
          maximum: 100
        hungerUpdatedAt:
          type: integer
          minimum: 0
        lastInteractionAt:
          type: integer
          minimum: 0
        lastDecayAt:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 0
        lastInteractionCategory:
          $ref: "#/components/schemas/CoopCareStatCategory"
        recentInteractionIds:
          type: array
          maxItems: 128
          items:
            type: string
            minLength: 1
            maxLength: 80
    CoopCareStatInteractionInput:
      type: object
      required: [interactionId, category, occurredAt]
      properties:
        interactionId:
          type: string
          minLength: 1
          maxLength: 80
        category:
          $ref: "#/components/schemas/CoopCareStatCategory"
        occurredAt:
          type: integer
          minimum: 0
    CoopCareStatInteractionResponse:
      type: object
      required: [careStats]
      properties:
        careStats:
          $ref: "#/components/schemas/CoopCareStats"
    CoopShareNote:
      type: object
      required: [id, category, title, message, excluded, createdAt, automatic]
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum: [daily, idea, worry]
        title:
          type: string
          maxLength: 48
        message:
          type: string
          maxLength: 180
        excluded:
          type: boolean
        createdAt:
          type: integer
          minimum: 0
        automatic:
          type: boolean
    CoopHouseholdResponse:
      type: object
      required: [householdId, playerNumber, memberCount, sharedState, queuedNotes, inbox]
      properties:
        householdId:
          type: string
          format: uuid
        playerNumber:
          type: integer
          enum: [1, 2]
        memberCount:
          type: integer
          enum: [1, 2]
        sharedState:
          $ref: "#/components/schemas/CoopSharedState"
        queuedNotes:
          type: array
          items:
            $ref: "#/components/schemas/CoopShareNote"
        inbox:
          type: array
          items:
            $ref: "#/components/schemas/CoopShareNote"
    CoopHouseholdInput:
      type: object
      required: [sharedState]
      properties:
        sharedState:
          $ref: "#/components/schemas/CoopSharedState"
    CoopInvitationResponse:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 12
        expiresAt:
          type: integer
          minimum: 0
    CoopJoinInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 12
    CoopStateInput:
      type: object
      required: [sharedState]
      properties:
        sharedState:
          $ref: "#/components/schemas/CoopSharedState"
    CoopStateResponse:
      type: object
      required: [sharedState, updatedAt]
      properties:
        sharedState:
          $ref: "#/components/schemas/CoopSharedState"
        updatedAt:
          type: integer
          minimum: 0
    CoopShareNoteInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1200
    CoopShareNoteUpdate:
      type: object
      required: [excluded]
      properties:
        excluded:
          type: boolean
    CoopDeliveryResponse:
      type: object
      required: [delivered]
      properties:
        delivered:
          type: boolean
        note:
          $ref: "#/components/schemas/CoopShareNote"
    CompanionContext:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
    CompanionMemory:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [worry, idea, action]
        text:
          type: string
          minLength: 1
          maxLength: 240
    CompanionInput:
      type: object
      required: [messages, userName, memories]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/CompanionContext"
        userName:
          type: string
          maxLength: 60
        memories:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/CompanionMemory"
        clearMindMode:
          type: boolean
          description: Enable the clear-mind support prompt for this reply only.
    CompanionResponse:
      type: object
      required: [reply, userName, memories, action]
      properties:
        reply:
          type: string
          minLength: 1
          maxLength: 300
        userName:
          type: string
          maxLength: 60
        memories:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/CompanionMemory"
        action:
          type: string
          enum: [none, performance]
    JournalClassificationInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
    JournalClassification:
      type: object
      required: [category, hasActionableGoal, reply]
      properties:
        category:
          type: string
          enum: [leisure, idea, worry]
        hasActionableGoal:
          type: boolean
        reply:
          type: string
          minLength: 1
          maxLength: 1600
          description: A warm personalized response to the journal entry
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

