kind = "web"
previewPath = "/"
title = "小熊猫日记"
description = "A solo or two-player red-panda companion game with private chat and diaries, shared gifts and room furniture, and emotion-only outing notes."
version = "1.0.0"
id = "artifacts/panda-journal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21836

[services.development]
run = "pnpm --filter @workspace/panda-journal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/panda-journal", "run", "build" ]
serve = "static"
publicDir = "artifacts/panda-journal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21836"
BASE_PATH = "/"
