name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - github-snapshot
      - "desktop-walking-*"
    paths:
      - ".github/workflows/windows-installer.yml"
      - "artifacts/panda-journal/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  build:
    name: Package 小熊猫日记 for Windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop walking and packaged assets
        run: node --test artifacts/panda-journal/desktop/pet-lite-model.test.cjs artifacts/panda-journal/desktop/platform-model.test.cjs artifacts/panda-journal/desktop/windows-platforms.test.cjs artifacts/panda-journal/desktop/background-bite.test.cjs

      - name: Build Windows desktop package
        env:
          PANDA_BUILD_OFFLINE_TRIAL: ${{ github.ref == 'refs/heads/desktop-walking-offline-trial' && '1' || '0' }}
        run: pnpm --filter @workspace/panda-journal run desktop:installer:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxiongmao-journal-windows-x64
          path: |
            generated-artifacts/windows-installer/*.exe
            generated-artifacts/windows-installer/BUILD-INFO.json
          if-no-files-found: error
          retention-days: 30

  publish-portable-test:
    name: Publish public offline trial download
    if: github.ref == 'refs/heads/desktop-walking-offline-trial'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: xiaoxiongmao-journal-windows-x64
          path: generated-artifacts/windows-installer

      - name: Publish portable executable as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "desktop-offline-trial-${GITHUB_RUN_NUMBER}" \
            generated-artifacts/windows-installer/Xiaoxiongmao-Offline-Trial-x64.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "小熊猫桌宠 · Windows 离线试玩" \
            --notes "Windows x64 免安装桌宠试玩，不联网、不登录、不使用正式宠物存档。小熊猫现在会蜷趴、低头咬窗口上沿。右键「立即咬屏幕（开发测试）」可试动作。取色仅在本机读取一个像素，不保存或上传画面。"
